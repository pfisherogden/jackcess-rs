[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jackcess-rs"
version = "0.1.0"
description = "Pure-Rust reader and writer for Microsoft Access Jet 3/4 and ACE (.mdb / .accdb) databases, API and binary compatible with Java Jackcess"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jackcess_rs" = ["_rust/Cargo.toml", "_rust/Cargo.lock", "_rust/src/*.rs"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP"]
ignore = [
    "N802", # Jackcess camelCase method names (getTable, addRowFromMap, etc.)
    "N818", # Exception naming parity
    "E501", # Line length
]
